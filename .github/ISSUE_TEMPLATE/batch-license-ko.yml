name: CSV Preflight Pro 주문 요청
description: 데이터 없이 15,000 sats 오프라인 배치 라이선스를 요청합니다.
title: "CSV Preflight Pro 주문 요청"
labels:
  - product-order
body:
  - type: markdown
    attributes:
      value: |
        이 공개 요청 자체는 결제가 아닙니다. CSV 내용, 파일명, 연락처, 결제 증빙, 인증정보 또는 비공개 링크를 올리지 마세요.

        판매자가 재고를 확인한 뒤 해당 이슈에만 연결된 일회용 15,000 sats BOLT11 인보이스를 30분 결제 기한과 함께 안내합니다. 서면 조건을 수락한 뒤에만 결제하세요. 인보이스 상태 주소로 공개 결제 증빙 없이 정산 여부를 확인합니다. 결제 확인 후 영업일 1일 안에 구매자 전용 비공개 GitHub 저장소로 라이선스 ZIP을 전달합니다.

        이용 조건: https://softpeanut.github.io/csv-preflight/pro-terms-ko.html
  - type: dropdown
    id: batch-size
    attributes:
      label: 한 번에 처리할 예상 파일 수
      options:
        - 2–5개
        - 6–10개
        - 11–20개
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: 주로 사용할 검증 프로필
      options:
        - 일반 CSV 구조
        - Shopify — 새 상품
        - Shopify — 상품 업데이트
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 주문 범위 확인
      options:
        - label: 판매자가 이슈 전용 15,000 sats 인보이스를 안내하기 전에는 결제하지 않겠습니다.
          required: true
        - label: 구매자 전용 비공개 GitHub 저장소로 파일을 전달받는 데 동의합니다.
          required: true
        - label: 데이터, 파일명, 연락처, 결제 증빙, 인증정보 또는 비공개 링크를 작성하지 않았습니다.
          required: true
        - label: 민감정보나 규제 대상 데이터를 이 제품으로 처리하지 않겠습니다.
          required: true
