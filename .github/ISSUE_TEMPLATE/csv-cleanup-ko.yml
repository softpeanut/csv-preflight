name: CSV 정리 범위 문의
description: 민감정보가 없는 CSV 한 개가 39,000원 또는 149,000원 고정 범위에 맞는지 확인합니다.
title: "CSV 정리 범위 문의: "
labels:
  - service-inquiry
body:
  - type: markdown
    attributes:
      value: |
        이 문의는 예약이나 결제가 아닙니다. CSV 파일, 실제 데이터, 개인정보, 인증정보, 비공개 링크 또는 금융·건강 등 규제 대상 정보를 올리지 마세요.
  - type: textarea
    id: problem
    attributes:
      label: 가져오기 문제
      description: 실제 데이터를 붙이지 말고 구조적 문제만 설명해 주세요.
      placeholder: 헤더가 반복되고 일부 행의 열 개수가 달라 가져오기가 실패합니다.
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: 요청 범위
      options:
        - 39,000원 구조 정리 — 최대 1MB, 스키마 맞춤·수정 제외
        - 149,000원 가져오기 맞춤 정리 — 최대 10MB, 목표 스키마 1개·수정 1회
        - 아직 모르겠습니다
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 목표 스키마 또는 가져오기 형식
      description: 149,000원 범위에만 필수입니다. 필요한 열 목록과 공개된 가져오기 문서가 있다면 적어 주세요.
  - type: dropdown
    id: size
    attributes:
      label: 대략적인 파일 크기
      options:
        - 1MB 미만
        - 1–5MB
        - 5–10MB
        - 10MB 초과 (고정 범위 제외)
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 안전 및 범위 확인
      options:
        - label: 이 공개 문의에 데이터, 인증정보 또는 비공개 링크를 올리지 않겠습니다.
          required: true
        - label: 원본에는 민감정보나 규제 대상 데이터가 없습니다.
          required: true
        - label: 작업 전에 범위, 납기, 결제 및 취소 조건을 서면으로 합의해야 함을 이해했습니다.
          required: true
