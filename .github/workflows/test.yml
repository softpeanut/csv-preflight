name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Verify standalone CLI contract
        shell: bash
        run: |
          set +e
          node cli.mjs examples/messy-contacts.csv \
            --output "$RUNNER_TEMP/normalized.csv" \
            --report "$RUNNER_TEMP/issues.csv"
          status=$?
          set -e
          test "$status" -eq 1
          test -s "$RUNNER_TEMP/normalized.csv"
          test -s "$RUNNER_TEMP/issues.csv"
      - name: Verify local Action contract
        id: local-action
        continue-on-error: true
        uses: ./
        with:
          path: examples/messy-contacts.csv
      - name: Assert Action failure and artifacts
        env:
          ACTION_OUTCOME: ${{ steps.local-action.outcome }}
        run: |
          test "$ACTION_OUTCOME" = failure
          test -s "$RUNNER_TEMP/csv-preflight.normalized.csv"
          test -s "$RUNNER_TEMP/csv-preflight.issues.csv"
