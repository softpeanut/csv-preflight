name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Verify standalone CLI contract
        shell: bash
        run: |
          set +e
          node cli.mjs examples/messy-contacts.csv \
            --output "$RUNNER_TEMP/normalized.csv" \
            --report "$RUNNER_TEMP/issues.csv"
          status=$?
          set -e
          test "$status" -eq 1
          test -s "$RUNNER_TEMP/normalized.csv"
          test -s "$RUNNER_TEMP/issues.csv"
